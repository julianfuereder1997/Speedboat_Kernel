# Nur für die lokale Entwicklung. Werte kommen aus .env (Vorlage: .env.example).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speedboat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speedboat_dev}
      POSTGRES_DB: ${POSTGRES_DB:-speedboat}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Legt bei einem frischen Volume die Testdatenbank speedboat_test an (bestehende Volumes: pnpm db:test).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
